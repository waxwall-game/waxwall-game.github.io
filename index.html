<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waxwall</title>
<meta name="description" content="Waxwall: build wax walls, post guard bees and keep the Queen safe all winter long. A tower defense game for Android.">
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1E150C; color: #F5E6C8;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { padding: 32px 16px; max-width: 620px; }
  .icon { width: 96px; height: 96px; border-radius: 22px; }
  h1 { margin: 12px 0 0; font-size: 56px; font-weight: 900; letter-spacing: 1px; color: #F2B33D;
       -webkit-text-stroke: 2px #0E0904; paint-order: stroke fill;
       text-shadow: 0 3px 0 #0E0904, 0 0 24px rgba(255, 165, 31, 0.25); }
  .tag { margin: 2px 0 20px; color: #C9A35A; letter-spacing: 4px; font-size: 13px; }
  .banner { width: 100%; max-width: 620px; border-radius: 14px; border: 2px solid #C98A26; }
  p { color: #C9B48E; line-height: 1.6; }
  a { color: #F2B33D; font-weight: 700; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Waxwall icon: a bee in a wax comb cell">
  <h1>Waxwall</h1>
  <div class="tag">WINTER HIVE DEFENSE</div>
  <img class="banner" src="banner.jpg" alt="The Queen in her warm hive and the bear in his snowy cave">
  <p>Build wax walls, post guard bees and keep the Queen safe through ten winter levels —
     all the way to the bear's cave.<br>
     A tower defense game for Android, coming soon to Google Play.</p>
  <p><a href="privacy/">Privacy policy</a> · <a href="mailto:waxwall.game@gmail.com">Contact</a></p>
</main>
</body>
</html>
